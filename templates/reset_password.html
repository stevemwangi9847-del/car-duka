{% extends "base.html" %}
{% block title %}Reset Password - Car Duka{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-card auth-card">
    <div class="auth-icon"><i class="fas fa-lock-open"></i></div>
    <h1>Reset Password</h1>
    <p class="page-sub">Enter a new password for <strong>{{ email }}</strong></p>

    <form method="POST" class="styled-form">
      <div class="form-row">
        <label><i class="fas fa-lock"></i> New Password *</label>
        <input type="password" name="password" required minlength="6" autofocus placeholder="Enter new password (min 6 chars)">
      </div>
      <div class="form-row">
        <label><i class="fas fa-check-double"></i> Confirm New Password *</label>
        <input type="password" name="confirm_password" required minlength="6" placeholder="Confirm new password">
      </div>
      <button type="submit" class="btn btn-primary full">
        <i class="fas fa-save"></i> Save New Password
      </button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
