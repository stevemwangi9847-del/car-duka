{% extends "base.html" %}
{% block title %}Register - Car Duka{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-card auth-card">
    <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
    <h1>Create Account</h1>
    <p class="page-sub">Register to book cars and manage viewings</p>

    <form method="POST" class="styled-form">
      <div class="form-row">
        <label><i class="fas fa-user"></i> Full Name *</label>
        <input type="text" name="full_name" required placeholder="John Doe">
      </div>
      <div class="form-row">
        <label><i class="fas fa-envelope"></i> Email *</label>
        <input type="email" name="email" required placeholder="you@example.com">
      </div>
      <div class="form-row">
        <label><i class="fas fa-phone"></i> Phone</label>
        <input type="tel" name="phone" placeholder="0718870024">
      </div>
      <div class="form-row two">
        <div>
          <label><i class="fas fa-lock"></i> Password *</label>
          <input type="password" name="password" required minlength="6" placeholder="Min 6 chars">
        </div>
        <div>
          <label><i class="fas fa-lock"></i> Confirm *</label>
          <input type="password" name="confirm_password" required minlength="6">
        </div>
      </div>
      <button type="submit" class="btn btn-primary full">
        <i class="fas fa-user-plus"></i> Register
      </button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
