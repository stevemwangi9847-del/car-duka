{% extends "base.html" %}
{% block title %}Forgot Password - Car Duka{% endblock %}
{% block content %}
<div class="container section">
  <div class="form-card auth-card">
    <div class="auth-icon"><i class="fas fa-key"></i></div>
    <h1>Forgot Password</h1>
    <p class="page-sub">Enter your registered email address to reset your password</p>

    <form method="POST" class="styled-form">
      <div class="form-row">
        <label><i class="fas fa-envelope"></i> Email Address *</label>
        <input type="email" name="email" required autofocus placeholder="you@example.com">
      </div>
      <button type="submit" class="btn btn-primary full">
        <i class="fas fa-arrow-right"></i> Continue
      </button>
    </form>

    <p class="auth-switch">
      Remembered your password? <a href="{{ url_for('auth.login') }}">Back to Login</a>
    </p>
  </div>
</div>
{% endblock %}
